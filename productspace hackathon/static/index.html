<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>Aftertone — Clip studio</title>
    <link rel="icon" href="/static/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/studio.css" />
    <link rel="stylesheet" href="/static/cover.css" />
  </head>
  <body>
    <header class="masthead">
      <a href="/" class="brand">Aftertone<span aria-hidden="true">.</span></a>
      <nav aria-label="Workspace">
        <button data-page="studio" class="active">Clip studio</button>
        <button data-page="calendar">Content calendar</button>
        <button data-page="memory">Brand memory</button>
        <button data-page="brief">Project brief</button>
      </nav>
      <div class="mast-actions">
        <a class="download-link" href="/download" aria-label="Download studio"
          ><span aria-hidden="true">↓</span> <span>Download</span></a
        >
        <button class="primary" id="new">
          Upload recording <span aria-hidden="true">↗</span>
        </button>
      </div>
    </header>
    <div class="shell">
      <main id="main" aria-live="polite">Opening studio…</main>
    </div>
    <dialog id="importer">
      <form id="upload">
        <div class="line">
          <h2>Import source</h2>
          <button type="button" class="close" aria-label="Close">×</button>
        </div>
        <label
          >Video or podcast<input
            required
            name="media"
            type="file"
            accept="audio/*,video/*" /></label
        ><label
          >Timed captions (.srt, optional)<input
            name="srt"
            type="file"
            accept=".srt"
        /></label>
        <label
          >Clip length in seconds<input
            type="number"
            name="seconds"
            min="30"
            max="180"
            value="30"
            required
        /></label>
        <p id="service"></p>
        <label class="checkbox" id="cloudoption"
          ><input type="checkbox" name="sarvam" /> Use Sarvam for transcription
          and editorial review. Send audio when captions are absent, plus
          selected transcript and brand examples.</label
        ><label
          >Spoken language<select name="language">
            <option value="unknown">Auto (English offline)</option>
            <option value="hi-IN">Hindi / Hinglish</option>
            <option value="en-IN">English</option>
          </select></label
        ><button class="primary">Find directions →</button>
      </form>
    </dialog>
    <dialog id="review"><div id="reviewbody"></div></dialog>
    <div id="toast" role="status"></div>
    <script defer src="/static/gsap.min.js"></script>
    <script defer src="/static/ScrollTrigger.min.js"></script>
    <script defer src="/static/cover-motion.js"></script>
    <script defer src="/static/app.js"></script>
  </body>
</html>
