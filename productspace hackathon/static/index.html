<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20221e" />
    <title>Aftertone — Clip studio</title>
    <link rel="icon" href="/static/icon.svg" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <aside>
      <a href="/" class="brand"
        ><img src="/static/icon.svg" alt="" />Aftertone</a
      ><small>WORKSPACE</small>
      <nav>
        <button data-page="studio" class="active"><i>◫</i> Clip studio</button
        ><button data-page="calendar"><i>▦</i> Content calendar</button
        ><button data-page="memory"><i>≋</i> Brand memory</button>
      </nav>
      <div class="foot">
        <a href="/download">↓ &nbsp; Download studio</a
        ><span class="avatar">A</span> Creator workspace
      </div>
    </aside>
    <div class="shell">
      <header>
        <span>Workspace <b>/</b> <strong id="crumb">Clip studio</strong></span
        ><a
          class="mobile-download"
          href="/download"
          aria-label="Download studio"
          >↓ Studio</a
        ><button class="primary" id="new">＋ Import source</button>
      </header>
      <main id="main" aria-live="polite">Opening studio…</main>
    </div>
    <dialog id="importer">
      <form id="upload">
        <div class="line">
          <h2>Import source</h2>
          <button type="button" class="close" aria-label="Close">×</button>
        </div>
        <label
          >Video or podcast<input
            required
            name="media"
            type="file"
            accept="audio/*,video/*" /></label
        ><label
          >Timed captions (.srt, optional)<input
            name="srt"
            type="file"
            accept=".srt"
        /></label>
        <p id="service"></p>
        <label class="checkbox" id="cloudoption"
          ><input type="checkbox" name="sarvam" /> Use Sarvam for transcription
          and editorial review. Send audio when captions are absent, plus
          selected transcript and brand examples.</label
        ><label
          >Spoken language<select name="language">
            <option value="unknown">Auto (English offline)</option>
            <option value="hi-IN">Hindi / Hinglish</option>
            <option value="en-IN">English</option>
          </select></label
        ><button class="primary">Find moments →</button>
      </form>
    </dialog>
    <dialog id="review"><div id="reviewbody"></div></dialog>
    <div id="toast" role="status"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
